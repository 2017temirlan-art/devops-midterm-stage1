spring.application.name=turganbek-temirlan-student-api
server.port=8080

# Student identity and individual test data (displayed by GET /)
app.student.full-name=Turganbek Temirlan
app.student.first-name=Temirlan
app.student.last-name=Turganbek
app.student.email=turganbek.temirlan@example.com
app.student.student-code=TURGANBEK-TEMIRLAN-001

# Database: values come from environment variables (see docker-compose.yml and .env.example).
# The default host is the Docker Compose service name "postgres", not localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
